<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exchange - Advanced Marketplace</title>

<style>
body {margin:0;font-family:Arial;background:#f5f6fa;}
header {background:#ff6f00;color:white;padding:15px;text-align:center;font-size:24px;font-weight:bold;}
nav {display:flex;justify-content:space-between;align-items:center;padding:10px 20px;background:white;border-bottom:1px solid #ddd;}
nav input {padding:6px;width:250px;border:1px solid #ccc;border-radius:5px;}

.layout {display:flex;}
.sidebar {
  width:220px;
  background:white;
  padding:15px;
  border-right:1px solid #ddd;
}
.sidebar h3 {margin-top:0;}
.sidebar div {margin:8px 0;cursor:pointer;color:#333;}

.container {flex:1;padding:20px;}
.grid {display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;}

.card {
  background:white;
  border-radius:10px;
  overflow:hidden;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
}
.card img {width:100%;height:140px;object-fit:cover;}
.card-content {padding:12px;}
.card h3 {margin:5px 0;font-size:16px;}
.price {color:#ff6f00;font-weight:bold;}

button {
  background:#ff6f00;
  color:white;
  border:none;
  padding:8px;
  border-radius:5px;
  cursor:pointer;
  width:100%;
}

.rating {color:gold;font-size:14px;}
.seller {font-size:12px;color:#777;}

.section {margin-bottom:30px;}

.upload-box {
  background:white;
  padding:15px;
  border-radius:10px;
}

footer {background:#ff6f00;color:white;text-align:center;padding:15px;margin-top:40px;}
</style>
</head>

<body>

<header>📚 Exchange Marketplace</header>

<nav>
  <strong>Browse Resources</strong>
  <input type="text" id="search" placeholder="Search..." onkeyup="searchNotes()">
</nav>

<div class="layout">

<div class="sidebar">
  <h3>Categories</h3>
  <div onclick="filter('all')">All</div>
  <div onclick="filter('math')">Math</div>
  <div onclick="filter('english')">English</div>
  <div onclick="filter('biology')">Biology</div>

  <h3>Grade</h3>
  <div onclick="filterGrade('12')">Grade 12</div>
  <div onclick="filterGrade('11')">Grade 11</div>
  <div onclick="filterGrade('10')">Grade 10</div>
</div>

<div class="container">

<div class="section">
<h2>Featured</h2>
<div class="grid" id="notes">

<div class="card" data-subject="math" data-grade="12">
<img src="https://picsum.photos/300/200?1">
<div class="card-content">
<h3>Algebra Final Pack</h3>
<div class="seller">by Alex</div>
<div class="rating">★★★★★</div>
<p class="price">$3</p>
<button onclick="buy(3)">Buy</button>
</div>
</div>

<div class="card" data-subject="biology" data-grade="11">
<img src="https://picsum.photos/300/200?2">
<div class="card-content">
<h3>Biology Exam Notes</h3>
<div class="seller">by Emma</div>
<div class="rating">★★★★☆</div>
<p class="price">$2</p>
<button onclick="buy(2)">Buy</button>
</div>
</div>

<div class="card" data-subject="english" data-grade="10">
<img src="https://picsum.photos/300/200?3">
<div class="card-content">
<h3>Essay Writing Guide</h3>
<div class="seller">by Leo</div>
<div class="rating">★★★★★</div>
<p class="price">Free</p>
<button onclick="buy(0)">Download</button>
</div>
</div>

</div>
</div>

<div class="section">
<h2>Upload Resource</h2>
<div class="upload-box">
<input id="title" placeholder="Title"><br><br>
<input id="subject" placeholder="Subject"><br><br>
<input id="grade" placeholder="Grade"><br><br>
<input id="price" placeholder="Price"><br><br>
<button onclick="upload()">Upload</button>
</div>
</div>

</div>

</div>

<footer>
<p>Capstone Advanced Version</p>
</footer>

<script>
let credits = 10;

function buy(cost){
  if(cost === 0){alert("Downloaded!");return;}
  if(credits >= cost){
    credits -= cost;
    alert("Purchased! Credits left: " + credits);
  } else {
    alert("Not enough credits");
  }
}

function upload(){
  let title = document.getElementById("title").value;
  let subject = document.getElementById("subject").value.toLowerCase();
  let grade = document.getElementById("grade").value;
  let price = document.getElementById("price").value || 0;

  let newCard = document.createElement("div");
  newCard.className = "card";
  newCard.setAttribute("data-subject", subject);
  newCard.setAttribute("data-grade", grade);

  newCard.innerHTML = `
  <img src="https://picsum.photos/300/200?random=${Math.random()}">
  <div class="card-content">
    <h3>${title}</h3>
    <div class="seller">by You</div>
    <div class="rating">★★★★★</div>
    <p class="price">$${price}</p>
    <button onclick="buy(${price})">Buy</button>
  </div>`;

  document.getElementById("notes").appendChild(newCard);
  alert("Upload success!");
}

function searchNotes(){
  let input = document.getElementById("search").value.toLowerCase();
  let cards = document.querySelectorAll(".card");

  cards.forEach(card => {
    let title = card.innerText.toLowerCase();
    card.style.display = title.includes(input) ? "block" : "none";
  });
}

function filter(subject){
  let cards = document.querySelectorAll(".card");
  cards.forEach(card => {
    if(subject === 'all' || card.getAttribute("data-subject") === subject){
      card.style.display = "block";
    } else {
      card.style.display = "none";
    }
  });
}

function filterGrade(grade){
  let cards = document.querySelectorAll(".card");
  cards.forEach(card => {
    if(card.getAttribute("data-grade") === grade){
      card.style.display = "block";
    } else {
      card.style.display = "none";
    }
  });
}
</script>

</body>
</html>
